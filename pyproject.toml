[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-edge-detector"
version = "0.1.0"
description = "Convert images into ASCII and Unicode edge illustrations"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "Pillow>=10",
    "scikit-image>=0.21",
    "scipy>=1.10",
]

[project.scripts]
askit = "main:main"

[tool.setuptools]
py-modules = ["defaults", "edge_detection", "helpers", "kernels", "main"]
